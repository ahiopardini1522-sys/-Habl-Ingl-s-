<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="202611261300">
<meta name="theme-color" content="#2a4fe0">
<title>Hablá Inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: alegre, de juego, frases cortas que animan; Pico el hornero acompaña
   IDEA: un sendero de monedas-lección como tablero de juego, con cofres e historias
   PICTURE: el sendero en zigzag con botones 3D y la mascota es la pantalla principal
   COLOUR and TYPE: cobalto + amarillo sol + coral para vidas; Fredoka títulos, Nunito texto
   LAYOUT: una columna de app de celular, barra superior fija, navegación abajo */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1430);--ink:light-dark(#1b2240,#eef1ff);--mute:light-dark(#6b7395,#9aa3c9);
--card:light-dark(#f2f5ff,#1a2150);--line:light-dark(#dde3fb,#2a3370);--lineD:light-dark(#c3cbef,#20285c);
--blue:#2f5bea;--blueD:#1f3fb0;--sun:#ffc531;--sunD:#d99a00;--coral:#ff5a5f;
--ok:#1f9d55;--okBg:light-dark(#dcf7e6,#123b27);--bad:#d93848;--badBg:light-dark(#ffe1e3,#45161d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top h1{font:700 21px Fredoka,sans-serif;margin:0;flex:1}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap;background:none;border:0;padding:0;color:inherit}
.stat svg{width:22px;height:22px}
.view{flex:1;padding-bottom:84px}
.hero{background:var(--blue);color:#fff;padding:4px 20px 24px;display:flex;gap:14px;align-items:center}
.hero .pico{width:92px;flex:none}
.hero b{font:600 22px/1.15 Fredoka,sans-serif;display:block;margin-bottom:2px}
.hero p{margin:0;opacity:.88;font-size:15px}
.goal{margin-top:10px;height:14px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.goal i,.prog i{display:block;height:100%;background:var(--sun);border-radius:9px;transition:width .4s}
.unit{margin:22px 16px 6px;border-radius:18px;padding:14px 18px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.unit h2{font:600 20px Fredoka,sans-serif;margin:0}.unit p{margin:2px 0 0;opacity:.92;font-size:15px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 8px}
.node{width:76px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .15s}
.node svg{width:34px;height:34px}
.node.open{background:var(--c);box-shadow:0 7px 0 var(--d);color:#fff}
.node.open:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sunD);color:#5a3d00}
.node.lock{background:var(--line);box-shadow:0 7px 0 var(--lineD);color:var(--mute);cursor:not-allowed}
.node.chest{border-radius:18px;width:84px}
.node.cur{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--mute);min-height:60px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--blue)}
.page{padding:20px 18px}
.page h2{font:600 26px/1.1 Fredoka,sans-serif;margin:0 0 6px}
.page .sub{color:var(--mute);margin:0 0 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px}
.row+.row{margin-top:4px}
.row.me{background:var(--card);outline:2px solid var(--blue)}
.rk{width:28px;text-align:center;font:700 18px Fredoka,sans-serif}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.row .nm{flex:1;font-weight:800}.row .xp{font-weight:800;white-space:nowrap;color:var(--mute)}
.zone{font-size:13px;font-weight:800;text-align:center;padding:6px;margin:6px 0;border-radius:8px}
.badge{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:2px solid var(--line)}
.medal{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff}
.medal svg{width:32px;height:32px}
.medal.off{background:var(--line)!important;color:var(--mute);box-shadow:0 4px 0 var(--lineD)}
.badge b{display:block;font:600 18px Fredoka,sans-serif}.badge small{color:var(--mute);font-weight:700}
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.shop{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:2px solid var(--line)}
.shop .ic{width:56px;height:56px;flex:none}.shop div{flex:1}.shop b{font:600 18px Fredoka,sans-serif;display:block}
.buy{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-weight:800;display:flex;gap:4px;align-items:center;min-height:44px;white-space:nowrap}
.buy svg{width:18px;height:18px}.buy:disabled{opacity:.45;cursor:default}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px solid var(--line);font-weight:800}
.foot{padding:20px 0;text-align:center;color:var(--mute);font-size:14px}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:800}
/* lección */
.lesson{display:flex;flex-direction:column;min-height:100vh}
.lhead{display:flex;align-items:center;gap:12px;padding:16px}
.x{width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--mute)}
.bar{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.combo{font:700 15px Fredoka,sans-serif;color:var(--sunD);text-align:center;height:20px;margin-top:-8px}
.body{flex:1;padding:4px 20px 20px}
.body.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.body h3{font:600 25px/1.15 Fredoka,sans-serif;margin:6px 0 16px}
.tell{display:flex;gap:10px;align-items:flex-end;margin-bottom:20px}
.tell .pico{width:84px;flex:none}
.bub{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.bub::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.mini{width:40px;height:40px;border-radius:10px;border:0;background:var(--blue);color:#fff;flex:none;display:grid;place-items:center;box-shadow:0 3px 0 var(--blueD)}
.mini svg{width:22px;height:22px}
.say{display:flex;gap:12px;align-items:center;margin-bottom:18px;justify-content:center}
.spk{width:84px;height:84px;border-radius:20px;border:0;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blueD);display:grid;place-items:center}
.spk svg{width:40px;height:40px}
.spk.slow{width:60px;height:60px;border-radius:16px}.spk.slow svg{width:30px;height:30px}
.opts{display:grid;gap:12px}
.opt{text-align:start;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:17px;min-height:54px}
.opt.sel{border-color:var(--blue);background:var(--card);box-shadow:0 4px 0 var(--blue)}
.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.gone{opacity:.3;pointer-events:none}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.match{grid-template-columns:1fr 1fr}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);box-shadow:0 3px 0 var(--line);font-weight:700;min-height:44px}
.tile.used{visibility:hidden}
.gapline{font-size:21px;font-weight:700;line-height:2;margin-bottom:6px}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);padding:0 6px}
.hint{color:var(--mute);font-weight:700;margin:0 0 18px}
.inp{width:100%;font:700 18px Nunito,sans-serif;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:110px;resize:none}
.mic{width:100%;min-height:72px;border-radius:18px;border:2px solid var(--line);background:var(--bg);box-shadow:0 5px 0 var(--line);font-weight:800;font-size:18px;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:10px}
.mic svg{width:30px;height:30px}.mic.rec{border-color:var(--coral);color:var(--coral)}
.status{text-align:center;color:var(--mute);font-weight:700;min-height:24px;margin-top:12px}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font-weight:800;text-decoration:underline;min-height:44px}
.chat{display:grid;gap:10px;margin-bottom:18px}
.line{display:flex;gap:8px;align-items:flex-start}
.line .av{width:36px;height:36px;font-size:14px}
.line button{flex:1;text-align:start;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:8px 12px;font-weight:700}
.line small{display:block;color:var(--mute);font-weight:700}
.line.r{flex-direction:row-reverse}
.tr{background:none;border:0;color:var(--blue);font-weight:800;padding:0;min-height:36px;margin-bottom:8px}
.check{padding:16px 20px 22px;border-top:2px solid var(--line)}
.check.ok{background:var(--okBg);border-color:transparent}.check.bad{background:var(--badBg);border-color:transparent}
.fb{font:600 21px Fredoka,sans-serif;margin:0 0 4px}.check.ok .fb{color:var(--ok)}.check.bad .fb{color:var(--bad)}
.fbx{margin:0 0 12px;font-weight:700}
.go{width:100%;min-height:52px;border:0;border-radius:14px;font-weight:800;font-size:17px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blueD);letter-spacing:.02em}
.go:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:default}
.check.ok .go{background:var(--ok);box-shadow:0 5px 0 #146b3a}.check.bad .go{background:var(--bad);box-shadow:0 5px 0 #8e1f2a}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:8px}
.end h3{font:700 32px/1.1 Fredoka,sans-serif;margin:0}
.end .pico{width:170px}
.chips{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--sun);border-radius:14px;padding:10px 14px;font-weight:800;min-width:100px}
.chip small{display:block;color:var(--mute);font-weight:700}
.newach{background:var(--card);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:6px}
[hidden]{display:none!important}
.dot{position:absolute;margin-left:22px;margin-top:-4px;background:var(--coral);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px;line-height:18px}
.nav button{position:relative}
.unit{display:flex;justify-content:space-between;align-items:center;gap:10px}
.guide{border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12px;min-height:48px;flex:none}
.guide svg{width:22px;height:22px}
.review{display:flex;gap:12px;align-items:center;margin:16px 16px 0;width:calc(100% - 32px);text-align:start;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);box-shadow:0 4px 0 var(--line)}
.review:disabled{opacity:.6;cursor:default}.review .ic{width:44px;height:44px;border-radius:12px;background:var(--coral);color:#fff;display:grid;place-items:center;flex:none}
.review .ic svg{width:28px;height:28px}.review b{display:block;font:600 18px Fredoka,sans-serif}.review small{color:var(--mute);font-weight:700}
.gline{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-weight:700;margin-bottom:6px;min-height:44px}
.gline svg{width:20px;height:20px;color:var(--blue);flex:none}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:6px}.vocab button{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:6px 10px;text-align:start;min-height:44px}
.vocab b{display:block}.vocab small{color:var(--mute);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:28px 1fr;align-items:center;column-gap:8px}
.stats svg{width:26px;height:26px;grid-row:span 2;color:var(--sunD)}.stats b{font:600 22px Fredoka,sans-serif;line-height:1}.stats small{color:var(--mute);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:170px;margin-top:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px}.week .b{flex:1;width:100%;max-width:34px;background:var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.week .b i{display:block;width:100%;border-radius:8px}.week .v{font-size:13px;font-weight:800;color:var(--mute)}.week small{font-weight:800}
.goals{display:flex;flex-wrap:wrap;gap:8px}.goals .tile.on{border-color:var(--blue);color:var(--blue);background:var(--card)}
.hearts{display:flex;align-items:center;gap:4px;padding:12px;border-radius:14px;background:var(--card);margin-bottom:6px;flex-wrap:wrap}
.hearts span svg{width:30px;height:30px}.hearts .off{filter:grayscale(1);opacity:.35}.hearts small{margin-left:auto;font-weight:800;color:var(--mute)}
.ub{display:flex;gap:6px;flex:none}
.boostline{display:flex;gap:6px;align-items:center;font-weight:800;color:var(--sunD);margin:12px 0 0}.boostline svg{width:20px;height:20px}
.dress{display:flex;gap:16px;align-items:center;margin-top:8px}.stage{width:120px;flex:none;background:var(--card);border-radius:20px;padding:10px}
.lab{font-weight:800;margin:0 0 8px}.sw{display:flex;flex-wrap:wrap;gap:10px}
.swc{width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}.swc.on{box-shadow:0 0 0 3px var(--blue)}
.accs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.acc{border:2px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 4px 0 var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.acc .pico{width:64px}.acc b{font-size:14px}.acc small{display:flex;gap:3px;align-items:center;font-weight:800;color:var(--mute);font-size:13px}.acc small svg{width:14px;height:14px}
.acc.on{border-color:var(--blue);box-shadow:0 4px 0 var(--blue)}.acc.on small{color:var(--blue)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0}.tools .review{margin:0;width:100%}
.wu{font:600 18px Fredoka,sans-serif;margin:18px 0 6px}
.wrow{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:0;border-bottom:2px solid var(--line);background:none;padding:10px 2px;min-height:56px}
.wrow .ic{width:36px;height:36px;border-radius:10px;background:var(--card);color:var(--blue);display:grid;place-items:center;flex:none}.wrow .ic svg{width:20px;height:20px}
.wt{flex:1}.wt b{display:block;font-size:17px}.wt small{color:var(--mute);font-weight:700}
.str{display:flex;gap:3px;align-items:flex-end}.str i{width:6px;height:16px;border-radius:3px;background:var(--line)}.str i:nth-child(1){height:8px}.str i:nth-child(2){height:10px}.str i:nth-child(3){height:12px}.str i:nth-child(4){height:14px}.str i.on{background:var(--ok)}
.flame{position:relative;width:170px;height:170px}.flame svg{width:100%;height:100%;animation:hop 1s ease infinite}
.flame b{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:700 40px Fredoka,sans-serif;color:#7a3a00}
.wkd{display:flex;gap:8px;justify-content:center;margin-top:8px}.wkd div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wkd span{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}.wkd span svg{width:20px;height:20px}
.wkd .on span{background:#ff9f1c}.wkd .today small{color:#ff9f1c}.wkd small{font-weight:800}
@media(prefers-reduced-motion:reduce){.flame svg{animation:none}}
.saytxt{text-align:center;font-weight:800;font-size:20px;margin:-6px 0 12px;color:var(--blue)}
.noear{margin:-8px auto 10px}
.toast{position:fixed;left:12px;right:12px;top:8px;z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 44px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast b{display:block;font:600 16px Fredoka,sans-serif}.toast span{font-size:14px}
.toast button{position:absolute;top:6px;right:6px;width:40px;height:40px;border:0;background:none;color:inherit;font-size:20px}
.vinfo{display:block;color:var(--mute);font-size:13px;font-weight:700}
.qspk{width:36px;height:36px;border-radius:10px;border:0;background:var(--card);color:var(--blue);vertical-align:middle;margin-right:8px;display:inline-grid;place-items:center}.qspk svg{width:20px;height:20px}
.lvbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.lvbox div{background:var(--card);border-radius:14px;padding:10px 12px}
.lvbox small{display:block;color:var(--mute);font-weight:700;font-size:13px}.lvbox b{font:600 19px Fredoka,sans-serif}
.sk{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-weight:800}.sk .prog{margin:0}.sk small{text-align:right;color:var(--mute)}
.rvtag{display:inline-flex;gap:6px;align-items:center;background:var(--card);color:var(--blue);font-weight:800;font-size:13px;border-radius:99px;padding:4px 10px;margin-bottom:4px}.rvtag svg{width:16px;height:16px}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;padding:20px;z-index:10}
.modal>div{background:var(--bg);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center}
.modal h3{font:600 24px Fredoka,sans-serif;margin:0 0 8px}
.modal .go{margin-top:12px}.modal .pico,.modal .big{width:130px;margin:0 auto}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pico.hop{animation:hop .6s ease}
@keyframes hop{40%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.node.cur,.pico.hop,.body.shake{animation:none}.conf{display:none}.goal i,.bar i,.prog i{transition:none}}

/* ===== Rediseño visual ===== */
:root{--bg:light-dark(#f4f7ff,#0d1230);--surf:light-dark(#ffffff,#161d48);--card:light-dark(#eef2ff,#1c2456);--line:light-dark(#dfe5fb,#28306a);--lineD:light-dark(#c6cff2,#1d2558)}
body{background:var(--bg)}
.top{background:linear-gradient(135deg,#3c6cff,#2a4fe0);box-shadow:0 2px 12px rgba(31,63,176,.25)}
.top .stat{background:rgba(255,255,255,.16);padding:4px 10px 4px 6px;border-radius:99px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2a4fe0 0%,#3c6cff 55%,#5b86ff 100%);border-radius:0 0 28px 28px;padding:8px 20px 28px;box-shadow:0 10px 30px -12px rgba(31,63,176,.6)}
.hero>*{position:relative}.clouds{position:absolute!important;inset:0;width:100%;height:100%}

 let h=`<div class="page"><button class="ghost" id="back" style="margin-bottom:12px">← Volver</button><h2>Mis palabras</h2><p class="sub">${k} de ${all.length} palabras aprendidas. Tocá una para escucharla.</p>
  <button class="review" id="flash" style="margin:0 0 14px;width:100%"><span class="ic" style="background:#e0457b">${I.book}</span><span><b>Tarjetas de repaso</b><small>Dalas vuelta y fijate si te acordás</small></span></button>
  <input class="inp" id="q" style="min-height:0;margin-bottom:12px" placeholder="Buscar en ${LNAME()} o español…" value="${esc(wq)}" autocomplete="off"><div id="wl"></div></div>`;
 shell(h);
 const draw=()=>{const q=norm(wq);let cur=-1,o="";
  all.filter(w=>!q||norm(w[0]).includes(q)||norm(w[1]).includes(q)).forEach(w=>{
   if(w[2]!==cur){cur=w[2];o+=`<p class="wu" style="color:${U[cur].c}">Unidad ${cur+1} · ${esc(U[cur].n)}</p>`}
   const st=S.str[w[0]]||0;
   o+=`<button class="wrow" data-say="${esc(w[0])}" data-es="${esc(w[1])}"><span class="ic">${I.spk}</span><span class="wt"><b>${esc(w[0])}</b><small>${esc(w[1])}</small></span><span class="str" title="Dominio ${st}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</span></button>`});
  const wl=document.getElementById("wl");wl.innerHTML=o||`<p class="sub">No encontré esa palabra.</p>`;
  wl.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say([[b.dataset.say,"en"],[b.dataset.es,"es"]]))};
 draw();
 const qi=document.getElementById("q");qi.oninput=()=>{wq=qi.value;draw()};
 document.getElementById("back").onclick=()=>{tab="learn";show()};
 document.getElementById("flash").onclick=()=>{SND.tap();flash()};
}
function flash(){
 const deck=unlockedW().map(w=>[w,(S.str[w[0]]||0)+Math.random()*2]).sort((a,b)=>a[1]-b[1]).slice(0,15).map(x=>x[0]);let i=0,ok=0;
 const draw=()=>{if(i>=deck.length)return end();const w=deck[i];
  app.innerHTML=`<div class="lesson"><div class="lhead"><button class="x" id="quit" aria-label="Salir">✕</button><div class="bar"><i style="width:${i/deck.length*100}%"></i></div><span class="stat">${i+1}/${deck.length}</span></div>
   <div class="body"><h3>¿Te acordás qué significa?</h3><button class="fcard" id="fc"><div class="fin"><div class="ff">${EMO[w[0]]?`<span class="emo">${EMO[w[0]]}</span>`:""}<b>${esc(w[0])}</b><small>Tocá para dar vuelta</small></div><div class="fb2"><b>${esc(w[1])}</b><small>${esc(w[0])}</small></div></div></button>
   <div class="fbtns" id="fbt" hidden><button class="go" id="no" style="background:var(--coral);box-shadow:0 5px 0 #c03a3e">NO LA SABÍA</button><button class="go" id="si" style="background:var(--ok);box-shadow:0 5px 0 #146b3a">¡LA SABÍA!</button></div></div></div>`;
  speak(w[0]);document.getElementById("quit").onclick=()=>{tab="words";show()};
  document.getElementById("fc").onclick=ev=>{const c=ev.currentTarget;if(c.classList.contains("flip"))return;c.classList.add("flip");speakEs(w[1]);document.getElementById("fbt").hidden=false};
  document.getElementById("si").onclick=()=>{bump(w[0],true);ok++;SND.ok();i++;save();draw()};
  document.getElementById("no").onclick=()=>{bump(w[0],false);SND.tap();i++;save();draw()}};
 const end=()=>{const xp=5;S.xp+=xp;monthAdd(xp);S.todayXp+=xp;S.weekXp+=xp;S.hist[day()]=(S.hist[day()]||0)+xp;markActive();qadd("xp",xp);save();SND.win();
  app.innerHTML=`<div class="lesson"><div class="end"><div class="burst"><div class="rays"></div>${pico("happy")}</div><h3>¡Repaso terminado!</h3><p>Te acordaste de <b>${ok}</b> de ${deck.length} palabras. Las que no sabías van a aparecer más seguido.</p>
   <div class="chips"><div class="chip"><small>XP</small>+${xp}</div></div><button class="go" id="again" style="max-width:320px">OTRA RONDA</button><button class="go" id="h" style="max-width:320px;margin-top:10px;background:var(--line);color:var(--ink);box-shadow:none">VOLVER</button></div></div>`;
  document.getElementById("again").onclick=flash;document.getElementById("h").onclick=()=>{tab="words";show()}};
 draw();
}

let CT=null;
function challenge(){
 const pool=shuf(unlockedW().length>=8?unlockedW():U[0].w.concat(U[1].w).map(w=>[w[0],w[1],0]));
 let deck=pool.slice(),score=0,combo=0,time=60,sel=null,end=false;
 const draw=()=>{if(!deck.length)deck=shuf(pool).filter(p=>!onBoard.some(b=>b[1]===p[1]||b[0]===p[0]));return deck.pop()};
 const onBoard=[];for(let i=0;i<5;i++){let p=draw();while(onBoard.some(b=>b[1]===p[1]||b[0]===p[0]))p=draw();onBoard.push(p)}
 const leftOrder=onBoard.slice(),rightOrder=shuf(onBoard.slice());
 app.innerHTML=`<div class="lesson"><div class="lhead"><button class="x" id="quit" aria-label="Salir">✕</button><div class="bar"><i id="tb" style="width:100%"></i></div><span class="stat" style="color:var(--sunD)">${I.bolt}<span id="sc">0</span></span></div>
  <div class="combo" id="cb"></div><div class="body"><h3>¡Uní todos los pares que puedas!</h3><p class="hint">Cada error resta 3 segundos.</p>
  <div class="opts match" id="bd">${leftOrder.map((p,i)=>`<button class="opt" data-s="L" data-i="${i}">${esc(p[0])}</button><button class="opt" data-s="R" data-i="${i}">${esc(rightOrder[i][1])}</button>`).join("")}</div></div></div>`;
 const bd=document.getElementById("bd"),L0=leftOrder,R0=rightOrder;
 const btn=(s,i)=>bd.querySelector(`[data-s="${s}"][data-i="${i}"]`);
 bd.onclick=ev=>{const b=ev.target.closest(".opt");if(!b||end||b.classList.contains("ok"))return;
  if(b.dataset.s==="L")speak(L0[b.dataset.i][0]);else speakEs(R0[b.dataset.i][1]);
  if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
  const l=sel.dataset.s==="L"?sel:b,r=sel.dataset.s==="R"?sel:b;sel.classList.remove("sel");sel=null;
  const li=+l.dataset.i,ri=+r.dataset.i;
  if(L0[li][1]===R0[ri][1]){SND.ok();score++;combo++;bump(L0[li][0],true);[l,r].forEach(x=>x.classList.add("ok"));
   document.getElementById("sc").textContent=score;document.getElementById("cb").textContent=combo>=3?`¡${combo} seguidas!`:"";
   if(combo%5===0){time=Math.min(60,time+3);document.getElementById("cb").textContent=`¡${combo} seguidas! +3 s`}
   setTimeout(()=>{let p=draw(),g=0;while(L0.concat(R0).some(b=>b!==L0[li]&&(b[1]===p[1]||b[0]===p[0]))&&g++<30)p=draw();
    L0[li]=p;R0[ri]=p;l.textContent=p[0];r.textContent=p[1];[l,r].forEach(x=>x.classList.remove("ok"))},260)}
  else{SND.bad();combo=0;time=Math.max(0,time-3);document.getElementById("cb").textContent="−3 s";[l,r].forEach(x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),400)})}
 };
 clearInterval(CT);const t0=Date.now();let last=t0;
 CT=setInterval(()=>{const n=Date.now();time-=(n-last)/1000;last=n;const tb=document.getElementById("tb");if(!tb){clearInterval(CT);return}
  tb.style.width=Math.max(0,time/60*100)+"%";tb.style.background=time<10?"var(--coral)":"var(--sun)";if(time<=0){end=true;clearInterval(CT);chalEnd(score)}},100);
 document.getElementById("quit").onclick=()=>{clearInterval(CT);tab="learn";show()};
}
function chalEnd(score){
 const rec=score>S.best;if(rec)S.best=score;const xp=Math.min(20,score)*xpMul();
 S.xp+=xp;monthAdd(xp);S.todayXp+=xp;S.weekXp+=xp;S.hist[day()]=(S.hist[day()]||0)+xp;markActive();S.mins+=1;qadd("xp",xp);const na=checkAch();save();SND.win();if(rec&&score)confetti();
 app.innerHTML=`<div class="lesson"><div class="end">${pico(score>=10?"happy":"")}<h3>${rec&&score?"¡Nuevo récord!":"¡Se acabó el tiempo!"}</h3>
  <div class="chips"><div class="chip"><small>Pares</small>${score}</div><div class="chip"><small>Récord</small>${S.best}</div><div class="chip"><small>XP</small>+${xp}</div></div>
  ${na.map(a=>`<div class="newach">Logro desbloqueado: ${esc(a[1])} (+20 gemas)</div>`).join("")}
  <button class="go" id="again" style="max-width:320px">JUGAR DE NUEVO</button><button class="go" id="h" style="max-width:320px;margin-top:10px;background:var(--line);color:var(--ink);box-shadow:none">VOLVER</button></div></div>`;
 document.getElementById("again").onclick=challenge;document.getElementById("h").onclick=()=>{tab="learn";show()};
}

function exs(pool,lv){
 lv=lv===undefined?1:lv;const nOpt=lv===0?2:3,nDis=lv===0?1:lv===2?5:3;
 const single=pool.map(x=>x[0]).filter(x=>!x.includes(" "));
 const singleEs=pool.map(x=>x[1]).filter(x=>!x.includes(" "));
 const others=p=>pick(pool.filter(x=>x[0]!==p[0]&&x[1]!==p[1]),nOpt);
 const esWords=t=>t.replace(/[¿?¡!.,]/g,"").split(" ").filter(Boolean);
 return{
  mc:p=>({k:"mc",p,q:`¿Cómo se dice «${p[1]}»?`,ans:p[0],opts:shuf([p[0],...others(p).map(x=>x[0])])}),
  rev:p=>({k:"rev",p,q:"¿Qué significa?",word:p[0],ans:p[1],opts:shuf([p[1],...others(p).map(x=>x[1])])}),
  ls:p=>({k:"listen",p,q:"¿Qué escuchaste?",say:p[0],ans:p[1],opts:shuf([p[1],...others(p).map(x=>x[1])])}),
  ty:p=>({k:"type",p,q:`Escribí en ${LNAME()}`,src:p[1],ans:p[0],clue:lv===0?p[0].split("").map((c,i)=>c===" "?"  ":i===0?c:"_").join(" "):""}),
  bd:s=>{const ws=s[0].split(" ");return{k:"build",s,q:"Traducí esta frase",src:s[1],ans:s[0],tiles:shuf([...ws,...pick(single.filter(x=>!ws.includes(x)),nDis)])}},
  bdEs:s=>{const ws=esWords(s[1]);return{k:"build",lang:"es",s,q:"Traducí al español",src:s[0],ans:ws.join(" "),tiles:shuf([...ws,...pick(singleEs.filter(x=>!ws.includes(x)),nDis)])}},
  fill:s=>{const ws=s[0].split(" ");let bi=0;ws.forEach((x,i)=>{if(x.length>ws[bi].length)bi=i});
   return{k:"fill",s,q:"Completá la frase",hint:s[1],pre:ws.slice(0,bi).join(" "),post:ws.slice(bi+1).join(" "),ans:ws[bi],say:s[0],opts:shuf([ws[bi],...pick(single.filter(x=>x!==ws[bi]&&!ws.includes(x)),nOpt)])}},
  dic:s=>({k:"dict",s,q:"Escribí lo que escuchás",say:s[0],ans:s[0]}),
  img:p=>{const c=pool.filter(x=>EMO[x[0]]&&x[0]!==p[0]);if(!EMO[p[0]]||c.length<3)return null;const o=[];for(const x of shuf(c)){if(!o.some(y=>EMO[y[0]]===EMO[x[0]]))o.push(x);if(o.length===(lv===0?2:3))break}
   return{k:"img",p,q:`Seleccioná la imagen de «${p[1]}»`,ans:p[0],cards:shuf([p,...o]).map(x=>[x[0],EMO[x[0]]])}},
  lt:s=>{const ws=s[0].split(" ");return{k:"build",listen:1,s,q:"Tocá lo que escuchás",say:s[0],ans:s[0],tiles:shuf([...ws,...pick(single.filter(x=>!ws.includes(x)),nDis)])}},
  spk:s=>({k:"speak",s,q:"Decí esta frase en voz alta",say:s[0],ans:s[0],src:s[1]})
 };
}
function build(gi){
 if(gi<0){ // repaso de errores
  const pool=S.weak.concat(pick(ALLW.filter(x=>!S.weak.some(y=>y[0]===x[0])),12)),E=exs(pool),o=[];
  const wf=[E.mc,E.rev,E.ls,E.ty],sf=[E.bd,E.fill,E.dic];
  pick(S.weak,6).forEach((p,i)=>o.push(wf[i%4](p)));pick(S.weakF,4).forEach((s,i)=>o.push(sf[i%3](s)));
  return shuf(o);
 }
 const ui=Math.floor(gi/NPU),u=U[ui],k=NODES[gi%NPU];
 if(k==="story")return u.st.q.map(q=>({k:"story",st:u.st,q:q[0],ans:q[1],opts:shuf(q[2])}));
 const li=[0,1,,2][gi%NPU];
 const lv=level(),E=exs(u.w,lv),W=u.w,F=u.f;
 /* Como Duolingo: la lección 1 presenta y hace reconocer, la 2 practica con frases, la 3 pide producir (escribir, dictado, hablar) */
 const plans=[
  [["img",0],["img",1],["mc",2],["img",3],["rev",0],["match",[0,1,2,3]],["ls",1],["bd",0],["img",2],["ls",3],["fill",1],["rev",2]],
  [["img",4],["mc",5],["img",6],["rev",4],["match",[3,4,5,6]],["ls",5],["fill",2],["bd",1],["lt",0],["ty",4],["bdEs",2],["mc",6]],
  [["img",7],["mc",8],["rev",9],["ty",7],["lt",3],["dic",4],["bdEs",1],["spk",5],["ty",8],["fill",4],["bd",5],["ty",9]]];
 const easier={ty:"mc",dic:"lt",bdEs:"bd",spk:"lt",lt:"bd"},harder={mc:"ty",rev:"ty",img:"img",bd:"bdEs"};
 let o=plans[li].map(([t,a],i)=>{
  if(lv===0&&easier[t])t=easier[t];if(lv===2&&i%3===2&&harder[t])t=harder[t];
  if(t==="match")return{k:"match",q:"Uní los pares",pairs:a.map(j=>W[j%W.length]).concat(lv===0?[]:[W[(a[3]+1)%W.length]])};
  const isS=["bd","bdEs","lt","dic","spk","fill"].includes(t),arg=isS?F[a%F.length]:W[a%W.length];
  return E[t](arg)||E.mc(arg)});
 // palabras nuevas: se presentan antes de la primera vez que aparecen
 const intro=new Set();for(let i=0;i<o.length;i++){const e=o[i];if(e.p&&!S.seen[e.p[0]]&&!intro.has(e.p[0])){intro.add(e.p[0]);o.splice(i,0,{k:"intro",p:e.p});i++}}
 // repaso espaciado: palabras de unidades anteriores que más necesitan práctica
 const old=dueWords(ui,2),EO=exs(ALLW,lv);
 old.forEach((p,i)=>{const e=lv===0?EO.mc(p):lv===2?EO.ty(p):(i?EO.rev(p):EO.ty(p));e.rv=1;o.splice(3+i*5,0,e)});
 return o;
}
function bump(en,right){S.str[en]=Math.max(0,Math.min(5,(S.str[en]||0)+(right?1:-1)));S.seen[en]=Date.now()}

function autoLevel(){const r=S.rh.slice(-30);if(r.length<8)return 1;const a=r.reduce((t,x)=>t+x[1],0)/r.length;return a<.7?0:a>=.9&&r.length>=15?2:1}
function level(){return S.diff==="auto"?autoLevel():{facil:0,normal:1,dificil:2}[S.diff]}
const LVN=["Fácil","Normal","Difícil"];
function dueWords(ui,n){if(ui<1)return [];const now=Date.now();
 const c=U.slice(0,ui).flatMap(u=>u.w).map(p=>[p,(S.str[p[0]]||0)*2-(S.seen[p[0]]?(now-S.seen[p[0]])/864e5:3)+Math.random()]);
 return c.sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function skills(){const G={Vocabulario:["mc","rev","type"],Escucha:["listen","dict"],Frases:["build","fill"],Historias:["story"]};
 return Object.entries(G).map(([n,ks])=>{const r=S.rh.filter(x=>ks.includes(x[0]));return [n,r.length?Math.round(r.reduce((t,x)=>t+x[1],0)/r.length*100):null,r.length]})}
function cefr(){const u=Math.floor(S.done/NPU);return u<5?["A1","Principiante"]:u<12?["A2","Básico"]:u<17?["B1","Intermedio"]:["B1+","Intermedio alto"]}
function markWeak(e,right){
 const add=(arr,x)=>{const i=arr.findIndex(y=>y[0]===x[0]);if(!right&&i<0){arr.push(x);if(arr.length>30)arr.shift()}if(right&&i>=0&&L.gi<0)arr.splice(i,1)};
 if(e.p){add(S.weak,e.p);bump(e.p[0],right)}if(e.s)add(S.weakF,e.s);
}

function practicePool(){const n=curUnit()+1;return{W:U.slice(0,n).flatMap(u=>u.w),F:U.slice(0,n).flatMap(u=>u.f)}}
const PRAC=[["escucha","Escucha","Entrená el oído con frases y dictados.",I.spk,"#2f5bea"],["habla","Pronunciación","Decí frases en voz alta con el micrófono.",I.mic,"#e0457b"],

function buildPractice(m){const {W,F}=practicePool(),lv=level(),E=exs(W,lv),f=pick(F,8),w=pick(W,8);
 if(m==="escucha")return f.map((s,i)=>[E.lt,E.dic,E.lt,E.dic][i%4](s)).slice(0,6).concat(w.slice(0,3).map(E.ls));
 if(m==="habla")return f.slice(0,7).map(E.spk);
 if(m==="escritura")return [E.ty(w[0]),E.bdEs(f[0]),E.ty(w[1]),E.bd(f[1]),E.dic(f[2]),E.ty(w[2]),E.bdEs(f[3]),E.ty(w[3])];
 const d=dueWords(curUnit()+1,8);return d.map((p,i)=>{const e=[E.img,E.ty,E.rev,E.mc][i%4](p)||E.mc(p);e.rv=1;return e});}

function soup(){
 const N=9;let ws,grid,place=[];
 for(let tries=0;tries<30;tries++){ws=gamePool(5,9);grid=Array.from({length:N},()=>Array(N).fill(""));place=[];let ok=true;
  for(const w of ws){const word=w[0].toUpperCase();let put=false;
   for(let t=0;t<150&&!put;t++){const d=rnd([[0,1],[1,0],[1,1]]),r=Math.floor(Math.random()*(N-(d[0]?word.length-1:0))),c=Math.floor(Math.random()*(N-(d[1]?word.length-1:0)));
    if(r<0||c<0)continue;let fits=true;for(let i=0;i<word.length;i++){const g=grid[r+d[0]*i][c+d[1]*i];if(g&&g!==word[i]){fits=false;break}}
    if(fits){for(let i=0;i<word.length;i++)grid[r+d[0]*i][c+d[1]*i]=word[i];place.push({w,r,c,d,len:word.length});put=true}}
   if(!put){ok=false;break}}
  if(ok)break}
 const AB="ABCDEFGHIJKLMNOPRSTUVWY";for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=AB[Math.floor(Math.random()*AB.length)];
 const found=new Set(),cellsFound=new Set();let start=null;
 const draw=()=>{app.innerHTML=`<div class="lesson">${gameHead("Sopa de letras")}<div class="body"><p class="hint" style="text-align:center">Tocá la primera y la última letra de cada palabra.</p>
  <div class="soup" style="grid-template-columns:repeat(${N},minmax(0,1fr))">${grid.map((row,r)=>row.map((ch,c)=>`<button class="sc${cellsFound.has(r+","+c)?" f":""}${start&&start[0]===r&&start[1]===c?" s":""}" data-r="${r}" data-c="${c}">${ch}</button>`).join("")).join("")}</div>
  <div class="slist">${place.map((p,i)=>`<span class="${found.has(i)?"ok":""}">${EMO[p.w[0]]||""} ${found.has(i)?`<b>${esc(p.w[0])}</b>`:esc(p.w[1])}</span>`).join("")}</div></div></div>`;
  document.getElementById("quit").onclick=()=>{tab="games";show()};
  app.querySelectorAll(".sc").forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=+b.dataset.c;
   if(!start){start=[r,c];SND.tap();return draw()}
   const [r0,c0]=start;start=null;let hit=-1;
   place.forEach((p,i)=>{if(found.has(i))return;const e=[p.r+p.d[0]*(p.len-1),p.c+p.d[1]*(p.len-1)];
    if((p.r===r0&&p.c===c0&&e[0]===r&&e[1]===c)||(p.r===r&&p.c===c&&e[0]===r0&&e[1]===c0))hit=i});
   if(hit>=0){const p=place[hit];found.add(hit);for(let i=0;i<p.len;i++)cellsFound.add((p.r+p.d[0]*i)+","+(p.c+p.d[1]*i));SND.ok();speak(p.w[0]);
    if(found.size===place.length)return setTimeout(()=>gameWin("soup","Encontraste todas las palabras.",soup),500)}else SND.bad();
   draw()})};
 draw();
}

  ex.innerHTML=`<h3>${esc(e.q)}</h3><div class="opts match">${A.map((w,i)=>`<button class="opt" data-s="L" data-w="${esc(w)}">${esc(w)}</button><button class="opt" data-s="R" data-w="${esc(B[i])}">${esc(B[i])}</button>`).join("")}</div>`;

 {const sb=ex.querySelector(".say");if(sb&&!sb.querySelector(".pico"))sb.insertAdjacentHTML("afterbegin",pico("","","auriculares"));

/* puntaje de pronunciación palabra por palabra */
function pronScore(target,heard){const a=norm(target).split(" "),b=norm(heard).split(" ");
 const ok=a.map(w=>b.some(x=>x===w||(w.length>3&&lev(x,w)<=1)));return{a,ok,pct:Math.round(ok.filter(Boolean).length/a.length*100)}}
function pron(target,heard){const r=pronScore(target,heard),orig=String(target).split(" ");
 const msg=r.pct===100?"¡Pronunciación perfecta!":r.pct>=80?"¡Muy bien!":r.pct>=60?"¡Bien! Practicá las palabras en rojo.":"Probá de nuevo, más despacio.";
 return `<div class="pron"><div class="pring" style="--p:${r.pct}"><b>${r.pct}%</b></div><div><b>${msg}</b><p>${orig.map((w,i)=>`<span class="${r.ok[i]?"pg":"pb"}" data-w="${esc(w)}">${esc(w)}</span>`).join(" ")}</p><small>Escuché: «${esc(heard)}»</small></div></div>`}
document.addEventListener("click",ev=>{const w=ev.target.closest&&ev.target.closest(".pron [data-w]");if(w)speak(w.dataset.w,true)});
function grade(e,v){
 if(e.k==="match")return true;
 if(e.k==="speak"){if(v==="__skip")return true;return pronScore(e.ans,v).pct>=60}
 const a=norm(e.ans),b=norm(v);if(a===b)return true;
 if((e.k==="type"||e.k==="dict")&&a.length>3&&lev(a,b)<=Math.max(1,Math.floor(a.length/10)))return "typo";
 return false;
}
function next(right){
 const e=L.q[L.i];
 if(L.place){L.ok++;if(!right){L.miss++;L.place.bad[e.pu]=1}if(L.miss>=3||L.i+1>=L.q.length)return placeEnd()}
 else if(L.test!==undefined){L.ok++;if(!right)L.miss++;if(L.miss>(L.legend!==undefined?2:3))return testFail()}
 else{if(right)L.ok++;else{L.miss++;L.q.push(e)} // los errores vuelven al final
  if(S.hearts<=0&&!L.prac)return fail()}
 L.i++;
 if(L.ok>=L.total)return finish();
 render();
}
function testFail(){SND.bad();
 app.innerHTML=`<div class="lesson"><div class="end">${pico("sad")}<h3>Esta vez no</h3><p>Te equivocaste más de ${L.legend!==undefined?2:3} veces. Practicá un poco más y volvé a intentarlo cuando quieras. No perdiste vidas.</p>
  <button class="go" id="h" style="max-width:320px">VOLVER</button></div></div>`;
 document.getElementById("h").onclick=()=>{tab="learn";show()};
}
function fail(){
 app.innerHTML=`<div class="lesson"><div class="end">${pico("sad")}<h3>Sin vidas</h3><p>Tranqui, equivocarse es parte de aprender. Se recarga una vida cada 4 horas, o recargalas en la tienda con gemas.</p>
  <button class="go" id="h" style="max-width:320px">VOLVER</button></div></div>`;
 document.getElementById("h").onclick=()=>{tab="learn";show()};
}
function finish(){
 const prac=!!L.prac,legend=L.legend!==undefined,review=L.gi===-1,story=!prac&&!review&&NODES[L.gi%NPU]==="story",perfect=L.miss===0,before=S.todayXp;
 const dbl=xpMul()>1,xp=((L.test!==undefined?25:story?15:10)+(perfect?5:0)+(L.best>=8?3:0))*(dbl?2:1),gems=5+(perfect?5:0);
 const acc=Math.round(L.total/(L.total+L.miss)*100),secs=Math.round((Date.now()-L.t0)/1000);
 S.xp+=xp;monthAdd(xp);S.todayXp+=xp;S.weekXp+=xp;S.gems+=gems;S.lessons++;markActive();S.mins+=Math.max(1,Math.round(secs/60));if(perfect)S.perfect++;if(story)S.stories++;S.bestCombo=Math.max(S.bestCombo,L.best);
 const wasNew=S.last!==day();if(wasNew){S.streak=(S.last===day(1)?S.streak:0)+1;S.last=day()}
 let extra="";
 if(legend){if(!S.legend[L.legend]){S.legend[L.legend]=1;S.gems+=40;extra="¡Unidad coronada! +40 gemas"}}
 else if(L.test!==undefined)S.done=Math.max(S.done,L.test*NPU);else if(!prac&&L.gi===S.done)S.done++;
 if(prac&&S.hearts<MAXH){S.hearts++;if(S.hearts>=MAXH)S.hlast=Date.now();extra="¡Recuperaste 1 vida!"}
 S.hist[day()]=(S.hist[day()]||0)+xp;Object.keys(S.hist).forEach(d=>{if(!Array.from({length:14},(_,i)=>day(i)).includes(d))delete S.hist[d]});
 qadd("xp",xp);qadd("lessons",1);if(perfect)qadd("perfect",1);if(story)qadd("story",1);if(review)qadd("review",1);qadd("combo",L.best,1);
 const goalNow=before<S.goal&&S.todayXp>=S.goal,lv1=level();
 const adapt=S.diff!=="auto"||L.lv0===undefined||review||prac?"":lv1>L.lv0?`¡Vas muy bien! Subo la dificultad a «${LVN[lv1]}»: más ejercicios para escribir y escuchar.`:lv1<L.lv0?`Bajo la dificultad a «${LVN[lv1]}» para que afiances lo aprendido. ¡Vas a ver que sale!`:"";
 const na=checkAch();save();SND.win();confetti();
 app.innerHTML=`<div class="lesson"><div class="end"><div class="burst"><div class="rays"></div>${pico("happy").replace('class="pico"','class="pico hop"')}</div><h3>${legend?`¡Leyenda: ${esc(U[L.legend].n)}!`:prac?"¡Práctica completa!":L.test!==undefined?`¡Aprobaste! Saltaste a la unidad ${L.test+1}`:review?"¡Repaso completo!":perfect?"¡Lección perfecta!":"¡Lección completa!"}</h3>
  ${adapt?`<div class="tell" style="max-width:420px;margin:6px 0">${pico("happy").replace('class="pico"','class="pico" style="width:60px"')}<div class="bub" style="font-size:15px"><span>${esc(adapt)}</span></div></div>`:""}
  ${extra?`<p class="extra">${extra.startsWith("¡Rec")?I.heart:I.crown}${extra}</p>`:""}
  ${goalNow?`<p style="margin:0;font-weight:800;color:var(--ok)">¡Cumpliste tu meta diaria de ${S.goal} XP!</p>`:""}
  
  <div class="chips"><div class="chip"><small>XP${dbl?" (doble)":""}</small>+<span data-count="${xp}">0</span></div><div class="chip"><small>Gemas</small>+${gems}</div><div class="chip"><small>Precisión</small>${acc}%</div><div class="chip"><small>Tiempo</small>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div></div>
  ${na.map(a=>`<div class="newach">Logro desbloqueado: ${esc(a[1])} (+20 gemas)</div>`).join("")}
  <button class="go" id="h" style="max-width:320px;margin-top:10px">CONTINUAR</button></div></div>`;
 document.getElementById("h").onclick=()=>{if(wasNew)return streakScreen();tab="learn";show()};
 document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
}
